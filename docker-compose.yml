version: '3.9'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: articles_db
      MYSQL_USER: articles_user
      MYSQL_PASSWORD: articles_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uarticles_user', '-particles_pass']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: articles_db
      DB_USER: articles_user
      DB_PASSWORD: articles_pass
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/uploads
      LOCAL_STORAGE_BASE_URL: http://localhost:3001/uploads
    ports:
      - '3001:3001'
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - '5173:5173'

volumes:
  db_data:
  uploads_data:
